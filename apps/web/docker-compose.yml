services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://note_guard:${POSTGRES_PASSWORD}@db:5432/note_guard
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - note_guard_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: note_guard
      POSTGRES_USER: note_guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - note_guard_db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U note_guard -d note_guard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  note_guard_db:
  note_guard_uploads:
